<!-- IKKI · Script Editor (ဆင့် ၃ — နှိပ်ဖျက်/ပြန်ထည့် · undo · keyboard · အသံ)
     ⚠️ ဒီဇိုင်း ကိန်းဂဏန်း (font · အရောင် · line-height · အရိပ် · 🔴 ကတ်) က
        Zin ၏ သတ်မှတ်ချက် — ကိုယ့်ဘာသာ မပြောင်းရ (၂၀၂၆-၀၉-၁၇ အတည်ပြုပြီး)。
     ⚠️ transcript စာသား မပြင်ရ (R7) · engine မထိရ。 -->
<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IKKI · စာသား တည်းဖြတ်</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9; --ink:#1C1917; --mute:#78716C; --faint:#A8A29E;
  --sil:#64748B; --rep:#D97706; --sec:#E11D48;
  --btn:#0F172A; --shadow:0 1px 3px rgba(0,0,0,.06); --w:780px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Myanmar","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:2.0;font-weight:400;-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--w);margin:0 auto;padding:0 20px 140px}
.wrap.top{padding-bottom:0}
.bar{position:sticky;top:0;z-index:10;background:rgba(250,250,249,.92);
     backdrop-filter:saturate(180%) blur(12px);padding:18px 0 14px;margin-bottom:28px}
.bar .in{max-width:var(--w);margin:0 auto;padding:0 20px}
.tm{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tm b{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.2;
      transition:color 150ms ease}
.tm b.hit{color:var(--sec)}
.tm .arw{color:var(--mute);font-size:22px}
.tm .sub{color:var(--mute);font-size:14px;margin-left:auto}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 18px;font:inherit;font-size:14px;
     font-weight:600;letter-spacing:-.005em;cursor:pointer;box-shadow:var(--shadow);
     font-family:inherit;
     transition:transform 160ms cubic-bezier(.22,.9,.28,1),
                box-shadow 220ms cubic-bezier(.22,.9,.28,1),
                background 220ms cubic-bezier(.22,.9,.28,1)}
.btn:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.07),0 12px 28px rgba(0,0,0,.09)}
.btn:active{transform:translateY(0) scale(.985);transition-duration:80ms}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px #0F172A22,0 0 0 4.5px var(--btn)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:#F5F5F4}
.btn.ghost.on{background:var(--ink);color:#fff}
.btn.warn{background:#fff;color:var(--sec)}
.btn.primary{background:var(--btn);color:#fff;margin-left:auto;
     box-shadow:0 2px 10px rgba(15,23,42,.24),0 8px 24px rgba(15,23,42,.14)}
.btn.primary:hover{background:#1E293B;
     box-shadow:0 2px 10px rgba(15,23,42,.28),0 14px 34px rgba(15,23,42,.20)}

.row{display:flex;gap:14px;padding:10px 14px;margin-bottom:12px;border-radius:10px;
     background:#fff;box-shadow:var(--shadow);transition:all 150ms ease;cursor:pointer;
     position:relative;border-left:3px solid transparent;
     transition:transform 160ms cubic-bezier(.22,.9,.28,1),
                box-shadow 220ms cubic-bezier(.22,.9,.28,1),background 160ms ease}
.row:hover{background:#FCFCFB;transform:translateY(-1px);
     box-shadow:0 2px 6px rgba(0,0,0,.06),0 10px 24px rgba(0,0,0,.06)}
.row.sel{outline:2px solid #0F172A22;outline-offset:2px}
.row .no{color:var(--mute);font-size:13px;min-width:76px;line-height:2.0;
         font-family:"Inter",sans-serif;white-space:nowrap}
.row .tx{flex:1}
/* ⚠️ အခြေအနေ ၃ ခုသာ — ဖြူ = ကျန်မယ် · နီဖျော့+ခြစ် = ပျောက်မယ် · 🔴 ကတ် = ဆုံးဖြတ်ပေးပါ
      အုပ်စု (cat) ကို အရောင်နဲ့ လုံးဝ မပြရ — ချန်မယ့် ဝါကျ ဘာ အမှတ်အသားမှ မပါရ
      (Zin ၂၀၂၆-၀၉-၁၈)。 ဘောင် အကျယ် ခုန်မသွားအောင် base မှာ transparent ထား。 */
.row.del{background:#FEF2F2;border-left-color:#FCA5A5}
.row.del .tx{opacity:.5;text-decoration:line-through}
.row .why{color:var(--faint);font-size:11px;font-family:inherit;align-self:center;
          white-space:nowrap;transition:opacity 150ms ease;
          border-radius:999px;padding:1px 8px;line-height:1.7}
/* ⚠️ အကြောင်းရင်း အလိုက် အရောင် (Zin ၂၀၂၆-၀၉-၁၉ တောင်းဆိုချက်) —
      **ဖျက်ထားသော ဝါကျမှာသာ** ပေါ်သည် ⇒ 「ချန်မယ့်ဟာ အမှတ်အသား မပါရ」 စည်းမျဉ်း မပျက်。*/
.row .why.w1{color:#B45309;background:#FEF3C7}   /* အပိုင်းအစ */
.row .why.w2{color:#1D4ED8;background:#DBEAFE}   /* မပြီးဆုံး */
.row .why.w3{color:#BE185D;background:#FCE7F3}   /* ထပ်နေ   */
/* ⚠️ ဟန်ပျက် — 「ကင်မရာရှေ့ စကားပြောနေဟန် မဟုတ်」 (ရုပ်ပုံမှ တိုင်းသည်)。
   ဤအညွှန်းက **hover မှာလည်း မပျောက်ရ** — အရေးအကြီးဆုံး အကြောင်းရင်း ဖြစ်၍。 */
.row .why.w4{color:#9F1239;background:#FFE4E6;font-weight:600}
.row:hover .why.w4{opacity:1}
.pwarn{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;padding:14px 16px;
   background:#FFF1F2;border:1px solid #FECDD3;border-radius:12px;font-size:13.5px;line-height:1.8}
.pwarn b{color:#9F1239}
.pwarn s{text-decoration:none;color:#9F1239;opacity:.85;display:block;margin-top:2px;font-size:12.5px}
/* ⚠️ `position:absolute` နဲ့ **မထားရ** — ✂ ခလုတ်ကို အုပ်ဖုံးပြီး နှိပ်လို့ မရ
   ဖြစ်ခဲ့သည် (Zin ၂၀၂၆-၀၉-၁၉: 「ဖြတ်ခလုတ်နဲ့ cut ခလုတ် ထပ်နေတယ်」)。
   ⇒ flex အတွင်းမှာ **နေရာ သီးသန့် ယူ**စေသည် (hover မှာ ပေါ်ရုံသာ)。 */
.row .act{opacity:0;transition:opacity 150ms ease;color:var(--mute);
          font-size:12.5px;align-self:center;white-space:nowrap;
          min-width:58px;text-align:right;flex:none}
.row:hover .act{opacity:.85}
/* ✂ ကို **ခလုတ် ပုံစံ** — မြင်သာပြီး နှိပ်ရ လွယ်စေရန် */
.row .spl{flex:none;z-index:2}
.row:hover .why{opacity:0}
/* ── 🔵 တိတ်ဆိတ်မှု — ကတ် မဟုတ် · ပါးပါး မျဉ်းသာ ── */
.sil{height:20px;line-height:20px;margin:0 0 12px 14px;color:var(--faint);
     font-size:11px;font-family:"Inter",sans-serif;letter-spacing:.01em}
/* ⚠️ 🟢 စကား မဟုတ်သော အသံ — ချောင်းဆိုး · ခေါက်သံ · အသက်ရှူ。
      **အမှတ်အသားသာ · အလိုအလျောက် မဖြတ်ပါ** (Zin ၂၀၂၆-၀၉-၁၉)。 */
.snd{height:20px;line-height:20px;margin:0 0 12px 14px;color:#15803D;
     font-size:11px;font-family:"Inter",sans-serif;letter-spacing:.01em}
.grp{background:#fff;border-left:3px solid var(--sec);border-radius:12px;
     box-shadow:var(--shadow);padding:16px 16px 10px;margin:22px 0}
.grp .hd{font-weight:600;font-size:15px;color:var(--sec);margin-bottom:6px}
.grp .note{color:var(--mute);font-size:13.5px;margin-bottom:12px}
.grp .row{background:#fff;margin-bottom:10px}
.grp .row.del{background:#FEF2F2}
.grp .foot{display:flex;gap:10px;align-items:center;margin-top:6px;padding-top:4px}
.grp .foot .sm{border:0;background:transparent;color:var(--mute);font:inherit;
     font-size:12.5px;opacity:.7;cursor:pointer;padding:6px 8px;border-radius:8px;
     transition:all 150ms ease}
.grp .foot .sm:hover{opacity:1;background:#F5F5F4}
.pill{display:inline-block;font-size:11.5px;color:var(--mute);background:#F5F5F4;
      border-radius:999px;padding:1px 9px;margin-left:8px;line-height:1.8;
      font-family:"Inter",sans-serif}
/* ── ⋯ ဝါကျ အတွင်း ခွဲခြင်း (Zin ၂၀၂၆-၀၉-၁၉) ── */
.row .spl{color:#57534E;font-size:13px;opacity:.6;align-self:center;
          padding:5px 9px;cursor:pointer;border-radius:8px;line-height:1;
          transition:all 150ms ease;user-select:none}
.row .spl:hover{opacity:1;background:#F5F5F4}
.row .spl.cut{opacity:1}
.prow{display:flex;gap:14px;padding:7px 14px;margin:0 0 8px 34px;border-radius:9px;
      background:#fff;box-shadow:var(--shadow);cursor:pointer;position:relative;
      border-left:3px solid transparent;font-size:15px}
.prow:hover{background:#FCFCFB}
.prow.del{background:#FEF2F2;border-left-color:#FCA5A5}
.prow.del .tx{opacity:.5;text-decoration:line-through}
.prow .no{color:var(--mute);font-size:12px;min-width:64px;font-family:"Inter",sans-serif;
          white-space:nowrap}
.prow .tx{flex:1}
.nosplit{color:var(--faint);font-size:11px;margin:0 0 10px 34px;font-family:inherit}
/* ── script နဲ့ မကိုက်တာ — **အနီ ပြရုံ · မဖျက်ပါ** (Zin ၂၀၂၆-၀၉-၁၉) ── */
.row.sm{border-left-color:#EF4444}
.row.sm .sx{color:#B91C1C;background:#FEE2E2;border-radius:999px;padding:1px 8px;
            font-size:11px;font-family:inherit;align-self:center;white-space:nowrap;
            line-height:1.7;margin-left:6px}
.row:hover .sx{opacity:0}
.sbox{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;
      margin:0 0 22px;font-size:13.5px}
.sbox textarea{width:100%;min-height:74px;border:1px solid #E7E5E4;border-radius:9px;
      padding:9px;font:inherit;font-size:13.5px;resize:vertical}
.sbox .r{display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap}
.sbox .n{color:var(--mute);font-size:12.5px}
/* ── အရောင် ရှင်းလင်းချက် — 「ဘာက ဘာလဲ」 တစ်ချက်တည်း မြင်ရရန် ── */
.lg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:10px;
    font-size:11.5px;color:var(--mute)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;
      vertical-align:-1px}
.hint{color:var(--mute);font-size:13px;text-align:center;margin:34px 0 10px}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#1C1917;
     color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;opacity:0;
     transition:opacity 150ms ease;pointer-events:none;z-index:20}
.tip.on{opacity:.94}
body.only .row:not(.del),body.only .sil{display:none}
body.only .grp .row:not(.del){display:none}
/* ── အတည်ပြု ပြီးနောက် — ဖတ်ရန် မြင်ကွင်း (ကျန်မယ့်ဟာ ဆက်တိုက်) ── */
body.rv .row.del,body.rv .sil,body.rv .grp .hd,body.rv .grp .note,
body.rv .grp .foot,body.rv .pill,body.rv .why,body.rv .act{display:none}
body.rv .row{cursor:default;box-shadow:none;background:transparent;padding:2px 14px;
             margin-bottom:0;border-left-color:transparent}
body.rv .grp{background:transparent;box-shadow:none;border-left-color:transparent;
             padding:0;margin:0}
body.rv #bsec,body.rv #bonly{display:none}
.done{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:18px;
      margin:26px 0;font-size:14px;line-height:1.9}
.done b{font-size:16px}
/* ── ဖြတ်ပြီး preview (Zin ၂၀၂၆-၀၉-၁၉: 「ပြီးတာနဲ့ preview ပြ · အိုကေပြီဆို နောက်အဆင့်」) ── */
.done video{width:100%;border-radius:10px;margin-top:12px;background:#000}
/* ⚠️ `.bar` နာမည်ကို **မသုံးရ** — အပေါ်က sticky ခေါင်းဘား `.bar` ရဲ့
   `padding:18px 0 14px` ကို အမွေခံပြီး ဘား ဖောင်းကာ အရောင် မပေါ်ခဲ့
   (Zin ၂၀၂၆-၀၉-၁၉: 「ဘယ်လောက် % ရောက်နေပြီဆိုတာ ပြပေးပါ」)。 ⇒ `.pbar` */
.done .pbar{height:10px;border-radius:99px;background:#F1F0EF;overflow:hidden;
     margin:12px 0 6px;padding:0;position:static;box-shadow:inset 0 1px 2px rgba(15,17,21,.06)}
.done .pbar i{display:block;height:100%;border-radius:99px;
     background:linear-gradient(90deg,#0F172A,#3B4A63 60%,#6B7A94);
     background-size:200% 100%;animation:pmove 1.6s linear infinite;
     transition:width 500ms cubic-bezier(.4,0,.2,1)}
@keyframes pmove{from{background-position:0 0}to{background-position:-200% 0}}
.done .pct{float:right;font-variant-numeric:tabular-nums;font-weight:700;
     font-size:15px;letter-spacing:-.01em;color:#0F172A}
.done .pstg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.done .pstg s{text-decoration:none;font-size:11.5px;padding:3px 8px;border-radius:99px;
     background:#F5F5F4;color:#A1A1AA;white-space:nowrap}
.done .pstg s.ok{background:#DCFCE7;color:#15803D}
.done .pstg s.now{background:#0F172A;color:#fff}
.done .acts2{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.done .er{color:var(--sec)}
@media(max-width:600px){.row .no{min-width:60px;font-size:12px}.tm b{font-size:24px}
  body{font-size:15px}}

/* ── အတည်ပြု ပေါ့အပ် (in-page) ──
   ⚠️ `confirm()` ကို **ဘယ်တော့မှ မသုံးရ** — browser/webview အချို့မှာ
      ဘာမှ မပြဘဲ **တိတ်တဆိတ် `false` ပြန်**သည် ⇒ ခလုတ် နှိပ်လို့ မရဟု ထင်ရသည်。
      (Zin ၂၀၂၆-၀၉-၁၉: 「✂️ Edit နှိပ်လို့ မရ」 · အရင် ဗီဒီယို ၂၆ ပုဒ် ပျက်ခဲ့သည့် အကြောင်းရင်းလည်း ဒါပဲ) */
#ask{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
     background:rgba(15,17,21,.55);backdrop-filter:blur(3px);padding:20px}
#ask.on{display:flex}
#ask .cd{background:#fff;border-radius:16px;max-width:400px;width:100%;
     box-shadow:0 24px 60px rgba(15,17,21,.28),0 2px 8px rgba(15,17,21,.12);
     padding:22px 22px 18px;animation:askin .18s ease-out}
@keyframes askin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
#ask h4{margin:0 0 8px;font-size:17px;font-weight:700;letter-spacing:-.01em}
#ask p{margin:0 0 18px;font-size:14px;line-height:1.7;color:#52525B}
#ask .rw{display:flex;gap:10px;justify-content:flex-end}
#ask .rw .btn{min-width:96px;justify-content:center}

/* ── အသံ ဖြစ်ရပ် (ချောင်းဆိုး · ခေါက်သံ) — တစ်ခုချင်း ဖျက်နိုင်ရမည် ──
   Zin ၂၀၂၆-၀၉-၁၉: 「အသံ နားထောင်လို့ ရတယ် ဒါပေမယ့် အဲဒီအထဲက စကားလုံးတွေ
   ချောင်းဆိုးသံတွေ ဖျက်ချင်ရင် ဘယ်လိုလုပ်ရမလဲ」 */
.snd b{cursor:pointer;font-weight:500;margin-left:10px;padding:1px 7px;border-radius:99px;
  background:#DCFCE7;font-size:11px;user-select:none}
.snd b:hover{background:#BBF7D0}
.snd.gone{opacity:.45;text-decoration:line-through}
/* ⚠️ ⏸ **အနားယူချက်** — engine က ပုံသေ ဖြတ်သည် ⇒ ပုံမှန်မှာ မျဉ်းကြား。
      「ပြန်ချန်」နှိပ်လျှင် ဖြတ်မည် မဟုတ်တော့ ⇒ မျဉ်း မကြားတော့。 */
.pau{display:flex;align-items:center;gap:10px;height:26px;margin:0 0 12px 14px;
     color:var(--faint);font-size:11px;font-family:"Inter",sans-serif;
     opacity:.55;text-decoration:line-through}
.pau canvas{width:150px;height:22px;border-radius:6px;background:#F8FAFC;
     border:1px solid #E2E8F0;flex:none}
.pau b{cursor:pointer;border-radius:999px;padding:3px 9px;font-weight:500;
     background:#F1F5F9;color:var(--mute)}
.pau.kept{opacity:1;text-decoration:none;color:#15803D}
.pau.kept b[data-pkeep]{background:#DCFCE7;color:#15803D}
.snd.gone b[data-sdel]{background:#FEE2E2;color:#B91C1C}
/* ── ဝါကျ အတွင်း နားနဲ့ ရွေးဖျက်ခြင်း ── */
.trim{margin:-6px 0 14px 14px;padding:12px 14px;background:#FAFAF9;
  border:1px solid #E7E5E4;border-radius:12px}

<div class="bar"><div class="in">

  <!-- ⚠️ script က **အမှတ်အသား** အတွက်သာ — ဘယ်တော့မှ အလိုအလျောက် မဖျက်ပါ -->

      ပြပါမယ် — <b>ဖျက်တာ မလုပ်ပါ</b>၊ သင် ကိုယ်တိုင် ဖျက်ပါ။</div>

<script>
var mm=function(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2)};
var esc=function(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;")};
var D=null, DEL={}, PDEL={}, UNDO=[], SEL=-1, SECS=[], AUDIO=null, JOB=null;
// ⚠️ SDEL = ဖျက်မည့် အသံ ဖြစ်ရပ် (ချောင်းဆိုး…) · TRIM = ဝါကျ အတွင်း နားနဲ့ ရွေးထားသော အပိုင်း
var SDEL={}, TRIM={};
// ⚠️ SKEEP = **ချန်ခိုင်းသော အနားယူချက်** (engine က ပုံသေ ဖြတ်သည်)。
//    `PAU_MIN` — ဒီထက် တိုသော အနားယူချက်ကို အကွက် မပြပါ (တစ်ခုချင်း
//    ပြလျှင် ဝါကျတိုင်းကြား အကွက် ၂၀ ကျော် ဖြစ်ပြီး ဖတ်ရ မရ)。
var SKEEP={}, PAU_MIN=0.60;


/* ── ask() — `confirm()` အစား ──
   `confirm()` က browser အချို့မှာ တိတ်တဆိတ် false ပြန်သဖြင့် **မမှီခိုရ**。
   Esc = မလုပ် · Enter = ဆက်လုပ် · အပြင် နှိပ် = မလုပ်。 */
function ask(title, msg, okTxt, onYes){
  var w=document.getElementById("ask");
  document.getElementById("askt").textContent=title;
  document.getElementById("askm").textContent=msg;
  var y=document.getElementById("asky"); y.textContent=okTxt||"ဆက်လုပ်";
  function shut(){w.classList.remove("on");document.removeEventListener("keydown",key);
    y.onclick=null;document.getElementById("askn").onclick=null;w.onclick=null}
  function go(){shut();onYes()}
  function key(e){ if(e.key==="Escape"){e.preventDefault();shut()}
                   else if(e.key==="Enter"){e.preventDefault();go()} }
  y.onclick=go;
  document.getElementById("askn").onclick=shut;
  w.onclick=function(e){ if(e.target===w) shut() };
  document.addEventListener("keydown",key);
  w.classList.add("on"); setTimeout(function(){y.focus()},60);
}
function tip(t){var e=document.getElementById("tip");e.textContent=t;e.classList.add("on");
  clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("on")},1600)}

function counts(){
  var del=0,kept=0,cut=0;
  D.sentences.forEach(function(s){
    if(DEL[s.n]){del++;cut+=(s.end-s.start)} else kept++;
  });
  // ⚠️ 🟢 အသံ ဖြစ်ရပ်က **အမှတ်အသားသာ · မဖြတ်ပါ** ⇒ ကြာချိန်ထဲက မနုတ်ရ
  (D.events||[]).forEach(function(e){ if(e.type!=="sound") cut+=e.dur });
  // ⚠️ အပိုင်း ဖျက်ချက် — ဝါကျ တစ်ခုလုံး မဖျက်ထားမှသာ ရေတွက်ရမည် (နှစ်ထပ် မဖြစ်စေရန်)
  Object.keys(PDEL).forEach(function(k){
    var a=k.split(":"), n=+a[0], s=D.sentences.find(function(z){return z.n===n});
    if(!s||!s.parts||DEL[n]) return;
    var p=s.parts[+a[1]]; if(p) cut+=(p.end-p.start);
  });
  var dur=D.src_dur||0;
  var t1=document.getElementById("t1");
  // ⚠️ ထုတ်ပြီးသား ဆိုလျှင် **ခန့်မှန်းချက် မဟုတ်ဘဲ တကယ့် ရလဒ်** ပြရမည်。
  //    segs က ချန်ထားပြီးသား ဝါကျများသာ ဖြစ်ပြီး src_dur က မူရင်း အတိုင်း
  //    ကျန်နေသဖြင့် တွက်လျှင် 「၆:၀၇ → ၆:၀၇」 ဟု မှားပြသည် (Zin ၂၀၂၆-၀၉-၁၉)。
  var isDone = (D.status==="done" && D.out_dur);
  t1.textContent = isDone ? mm(D.out_dur) : mm(Math.max(0,dur-cut));
  t1.classList.add("hit");setTimeout(function(){t1.classList.remove("hit")},200);
  document.getElementById("t0").textContent=mm(dur);
  var _lb=document.getElementById("tlbl");
  if(!_lb){ _lb=document.createElement("span"); _lb.id="tlbl";
    _lb.style.cssText="font-size:12px;color:var(--mute);margin-left:8px";
    t1.parentNode.insertBefore(_lb, t1.nextSibling); }
  _lb.textContent = isDone ? "ထုတ်ပြီးသား" : "";
  document.getElementById("nd").textContent=del;
  document.getElementById("nk").textContent=kept;
}
/* ⚠️ အကြောင်းရင်း — ဤစည်းမျဉ်း ၃ ခုက **ငါ တွက်ထားတာ** သာ။
      engine/API က အကြောင်းရင်း မပေးပါ (field မရှိ) ⇒ စာသား နဲ့ အုပ်စု ကနေ ခွဲတာ。
      ⚠️ ဦးစားပေး အစဉ် — အပိုင်းအစ > မပြီးဆုံး > ထပ်နေ (Zin ၂၀၂၆-၀၉-၁၈)
      ① စာလုံး < ၁၂ → «အပိုင်းအစ»
      ② «။» နဲ့ မဆုံး → «မပြီးဆုံး»
      ③ အုပ်စု ထဲ ပါ → «ထပ်နေ»
      «အမြီး» — Zin: မထည့်ရ。 ၃ ခုနဲ့ လုံလောက်သည်。 */
function why(s){
  var t=(s.text||"").trim();
  if(t.replace(/\s+/g,"").length<12) return "အပိုင်းအစ";
  if(!/[။?!]$/.test(t)) return "မပြီးဆုံး";
  if(s.group_id) return "ထပ်နေ";
  return "";
}
function paint(){
  document.querySelectorAll(".row[data-n]").forEach(function(r){
    var n=+r.getAttribute("data-n"), s=D.sentences.find(function(x){return x.n===n});
    r.classList.toggle("del",!!DEL[n]);
    var a=r.querySelector(".act"); if(a) a.textContent=DEL[n]?"↩ ပြန်ထည့်":"✕ ဖျက်";
    var w=r.querySelector(".why");
    if(w){ var t=DEL[n]&&s?why(s):"";
      w.textContent=t; w.className="why"+(t?" w"+({"အပိုင်းအစ":1,"မပြီးဆုံး":2,"ထပ်နေ":3}[t]||""):""); }
  });
  document.querySelectorAll(".prow[data-pn]").forEach(function(r){
    r.classList.toggle("del", !!PDEL[r.getAttribute("data-pn")]);
  });
  counts();
}
function toggle(n,push){
  if(push!==false) UNDO.push(Object.assign({},DEL));
  if(DEL[n]) delete DEL[n]; else DEL[n]=1;
  paint();
}
function undo(){
  if(!UNDO.length){tip("ပြန်ပြင်စရာ မရှိ");return}
  DEL=UNDO.pop(); paint(); tip("ပြန်ပြင်ပြီး");
}
var _HD=null;
function head(a){
  cancelAnimationFrame(_HD);
  var lines=[].slice.call(document.querySelectorAll(".trim .tbar s"));
  if(!a){ lines.forEach(function(l){l.style.display="none"}); return }
  (function step(){
    lines.forEach(function(l){
      var bar=l.parentNode, cv=bar.querySelector("canvas[data-w]");
      if(!cv) return;
      var w0=+cv.getAttribute("data-w0"), w1=+cv.getAttribute("data-w1");
      var t=a.currentTime;
      if(t>=w0&&t<=w1){ l.style.display="block"; l.style.left=((t-w0)/(w1-w0)*100)+"%" }
      else l.style.display="none";
    });
    _HD=requestAnimationFrame(step);
  })();
}
function playRange(t0,t1,label){
  if(!AUDIO){tip("အသံ မရှိ — ဗီဒီယို ပြန်တင်ပါ");return}
  var a=document.getElementById("au");
  if(!a.src) a.src=AUDIO;
  try{ a.currentTime=t0; a.play(); }catch(e){ tip("အသံ ဖွင့်၍ မရ"); return }
  clearTimeout(a._t); a._t=setTimeout(function(){a.pause(); head(null)},(t1-t0)*1000+150);
  // ⚠️ **ဘယ်နေရာ ရောက်နေလဲ မြင်ရမည်** — မမြင်ရလျှင် နားထောင်ရုံနဲ့ မလုံလောက်
  head(a);
  tip("▶ "+(label||mm(t0)));
}
function play(n){
  var s=D.sentences.find(function(x){return x.n===n}); if(!s) return;
  playRange(s.start, s.end, "["+n+"] "+mm(s.start));
}
function select(i){
  var rows=[].slice.call(document.querySelectorAll(".row[data-n]"));
  if(!rows.length) return;
  SEL=Math.max(0,Math.min(rows.length-1,i));
  rows.forEach(function(r,k){r.classList.toggle("sel",k===SEL)});
  rows[SEL].scrollIntoView({block:"center",behavior:"smooth"});
}

function render(d){
  D=d; var S=d.sentences||[], E=(d.events||[]).slice(), out=[], ei=0;
  var _ai=0;
  S.forEach(function(s){ if(s.suggest==="delete"){ DEL[s.n]=1; _ai++ } });
  // ⚠️ ငါ ကြိုဖျက်ထားတာ ဘယ်နှစ်ခုလဲ **အမြဲ ပြရမည်** — မပြလျှင် သုံးစွဲသူက
  //    ဘယ်ဟာ သူ ဖျက်တာလဲ၊ ဘယ်ဟာ စက် ဖျက်တာလဲ မခွဲနိုင်。
  var _n=document.getElementById("nai");
  if(_n) _n.textContent = _ai? ("  ·  ဤထဲ "+_ai+" က ငါ အကြံပြုထား") : "";
  // ⚠️ ဟန်ပျက် — **သတိပေးချက် သီးသန့် ပြရမည်** (Zin ၂၀၂၆-၀၉-၁၉:
  //    「ဖြတ်ရမည့် စာရင်းထဲ ထည့်ပြီး user ကို သတိပေးရမယ်」)。 အခြား အကြံပြုချက်
  //    တွေနဲ့ ရောပြလျှင် user က ဒါက ဘာကြောင့်လဲ မသိနိုင်。
  var _pz=S.filter(function(x){return x.pose});
  if(_pz.length){
    var pw=document.createElement("div"); pw.className="pwarn";
    pw.innerHTML='<div style="font-size:18px;line-height:1">⛔</div><div>'
      +'<b>ဝါကျ '+_pz.length+' ကြောင်း — ကင်မရာရှေ့ စကားပြောနေဟန် မဟုတ်ပါ</b>'
      +'<s>ကင်မရာကို လှမ်းကိုင်နေ · ဘောင်ထဲက ထွက်သွား · အခြားနေရာ ကြည့်နေ — '
      +'ဒါတွေကို <b>ကြိုဖျက်ပေးထား</b>ပါတယ်။ မလိုချင်ရင် တစ်ခုချင်း ပြန်ထည့်လို့ ရပါတယ်။</s>'
      +'<s>'+_pz.map(function(x){return "["+x.n+"] "+mm(x.start)}).join("  ·  ")+'</s></div>';
    var wr=document.querySelector(".wrap"); if(wr) wr.prepend(pw);
  }
  // ⚠️ တိတ်ဆိတ်မှုကို **ဝါကျ တစ်ခုချင်းရဲ့ ရှေ့မှာ** ထည့်ရမည် — ယခင်က 🔴 ကတ်
  //    အတွင်းမှာ မထည့်မိ၍ ကတ် ရှေ့မှာ အစုလိုက် စုပုံနေခဲ့သည် (Zin တွေ့ · ၂၀၂၆-၀၉-၁၇)。
  // ⚠️ ဝါကျ မကြားရှိသော တိတ်ဆိတ်မှု အများကို **တစ်ကြောင်းတည်း** ပေါင်းပြသည် —
  //    ဒါပေမယ့် "၁၅.၁s တိတ်" ဟု တစ်တုံးတည်း မပြောရ (ကြားထဲ အသံ ရှိနိုင်၍)
  //    ⇒ ပိုင်း အရေအတွက် ပါ ဖော်ပြသည် (Zin ၂၀၂၆-၀၉-၁၈)。
  function silUntil(t){
    var o="",n=0,sum=0;
    function flush(){ if(!n) return;
      o+='<div class="sil">⏸ '+sum.toFixed(1)+'s တိတ်'+(n>1?' · '+n+' ပိုင်း':'')+'</div>';
      n=0; sum=0; }
    while(ei<E.length && E[ei].start < t){
      var e=E[ei++];
      if(e.type==="sound"){ flush();
        var _k=e.start.toFixed(2)+":"+(e.start+e.dur).toFixed(2);
        // ⚠️ **မမြင်ရဘဲ ဖျက်ခိုင်း၍ မရ** (Zin ၂၀၂၆-၀၉-၁၉)。 ဘေးက ±၀.၄s
        //    အခြေအနေနဲ့တကွ အသံပုံ ပြသည် — ချောင်းဆိုးသံက ချွန်ထွက်နေသည်。
        o+='<div class="snd'+(SDEL[_k]?' gone':'')+'" data-sk="'+_k+'">'
          +'<canvas data-w data-w0="'+Math.max(0,e.start-0.4).toFixed(2)
          +'" data-w1="'+(e.start+e.dur+0.4).toFixed(2)+'"'
          +' data-ha="'+e.start.toFixed(2)+'" data-hb="'+(e.start+e.dur).toFixed(2)+'"></canvas>'
          +'<span>🟢 '+Math.round(e.dur*1000)+'ms'
          +(e.db!=null?' · '+e.db+' dB':'')+' — စကား မဟုတ်</span>'
          +'<b data-splay>▶ နားထောင်</b>'
          +'<b data-sdel>'+(SDEL[_k]?'↩ ပြန်ထည့်':'✕ ဖျက်')+'</b></div>'; }
      else if(e.dur>=PAU_MIN){
        // ⚠️ **ရှည်သော အနားယူချက်ကို edit လုပ်နိုင်ရမည်** (Zin ၂၀၂၆-၀၉-၂၁:
        //    「ဒီနေရာတွေပါ စိတ်ကြိုက် edit လို့ရအောင်」)。 engine က ပုံသေ
        //    ဖြတ်သည် — ဒါပေမယ့် အသားပေးချက် · အသက်ရှူ · ရပ်တန့်ချက် တွေက
        //    တမင် ထားတာ ဖြစ်နိုင်သည်。 ⇒ နားထောင်ပြီး ချန်နိုင်စေသည်。
        flush();
        var _pk=e.start.toFixed(2)+":"+e.end.toFixed(2), _on=!!SKEEP[_pk];
        o+='<div class="pau'+(_on?' kept':'')+'" data-pk="'+_pk+'">'
          +'<canvas data-w data-w0="'+Math.max(0,e.start-0.3).toFixed(2)
          +'" data-w1="'+(e.end+0.3).toFixed(2)+'"'
          +' data-ha="'+e.start.toFixed(2)+'" data-hb="'+e.end.toFixed(2)+'"></canvas>'
          +'<span>⏸ '+e.dur.toFixed(1)+'s အနားယူ — '+(_on?'ချန်မည်':'ဖြတ်မည်')+'</span>'
          +'<b data-pplay>▶ နားထောင်</b>'
          +'<b data-pkeep>'+(_on?'✕ ဖြတ်':'↩ ပြန်ချန်')+'</b></div>';
      }
      else { sum+=e.dur; n++; }
    }
    flush(); return o;
  }
  // ⚠️ cat ကို class အဖြစ် မထည့်တော့ပါ — အုပ်စုကို အရောင်နဲ့ မပြရ (Zin ၂၀၂၆-၀၉-၁၈)
  function rowHtml(s,longest){
    return '<div class="row'+(s.script_mark?' sm':'')+'" data-n="'+s.n+'">'
      +'<div class="no">['+s.n+'] '+mm(s.start)+'</div>'
      +'<div class="tx">'+esc(s.text)+(s===longest?'<span class="pill">ပြည့်စုံဆုံး</span>':'')+'</div>'
      +(s.script_mark?'<div class="sx">'+(s.script_mark==="dup"?"၂ ခါ ပြောထား":"script မှာ မပါ")+'</div>':'')
      +'<div class="spl'+((TRIM[s.n]||[]).length?' cut':'')+'" data-trim="'+s.n+'"'
      +' title="ဝါကျ အတွင်း နားနဲ့ ရွေးဖျက်">✂</div>'
      +(s.parts&&s.parts.length>1?'<div class="spl" data-spl="'+s.n+'" title="ဝါကျ အတွင်း ခွဲ">⋯</div>':'')
      +(s.pose?'<div class="why w4">⛔ '+esc(s.pose)+'</div>':'<div class="why"></div>')
      +'<div class="act"></div></div>';
  }
  var i=0;
  while(i<S.length){
    var s=S[i];
    if(s.cat==="section" && s.group_id){
      // ⚠️ 🔴 ကတ် = "အုပ်စု" မဟုတ် **"ဒေသ"** (Zin ၂၀၂၆-၀၉-၁၈)。
      //    "ဆက်တိုက်သာ" စည်းမျဉ်း ရုပ်သိမ်း — အုပ်စု အဖွဲ့ဝင် ပထမ မှ နောက်ဆုံး အထိ
      //    ကြားက အဖွဲ့ဝင် မဟုတ်သော ဝါကျ (ဥပမာ cl31 ရဲ့ [154][158][159]) ပါ ကတ်ထဲ ဝင်သည်。
      //    ⇒ ကတ် တစ်ခုသာ ဖြစ်ရမည် (ယခင်က cl31 ကို ၃ ပိုင်း ကွဲစေခဲ့သည်)。
      var gid=s.group_id, last=i, again=true, j, k;
      for(j=i;j<S.length;j++) if(S[j].group_id===gid) last=j;
      while(again){ again=false;                 // ကြားထဲ အခြား 🔴 အုပ်စု ဝင်လျှင် ပေါင်း
        for(j=i;j<=last;j++) if(S[j].cat==="section" && S[j].group_id!==gid)
          for(k=last+1;k<S.length;k++) if(S[k].group_id===S[j].group_id){last=k;again=true}
      }
      var g=S.slice(i,last+1); i=last+1;
      var mem=g.filter(function(x){return x.group_id===gid});
      var longest=mem.reduce(function(a,b){return (b.text||"").length>(a.text||"").length?b:a});
      out.push(silUntil(g[0].start));
      var h='<div class="grp" data-g="'+gid+'"><div class="hd">⚠️ ဤနေရာတွင် ပြန်ရိုက်ထားခြင်း ရှိသည် — တစ်ခုချင်း စစ်ပါ</div>'
        +'<div class="note">ဝါကျ '+g.length+' ခု · '+mm(g[0].start)+'–'+mm(g[g.length-1].end)
        +' · ဘယ်ဟာ ချန်မလဲ သင် ရွေးပါ</div>';
      g.forEach(function(x,k){ if(k) h+=silUntil(x.start); h+=rowHtml(x,longest) });
      // ⚠️ "ဒီအားလုံး ဖျက်" ကို **ဖယ်ရှားပြီး** — ပြန်စ အုပ်စု တစ်ခုလုံး ဖျက်ခြင်းသည်
      //    ဘယ်တော့မှ မှန်ကန်သော ရလဒ် မဟုတ် (cl31 မှာ ဗီဒီယို နိဂုံး [163][164] ပါနေသည်)。
      //    take တစ်ခု **အမြဲ ကျန်ရမည်** (Zin ၂၀၂၆-၀၉-၁၈)。
      // ⚠️ "ပြည့်စုံဆုံးကို ချန်" ခလုတ်ကိုလည်း **ဖြုတ်ပြီး** (Zin ၂၀၂၆-၀၉-၁၈) —
      //    cl31 မှာ [163]+[164] နှစ်ခုလုံး ချန်ရမည်ကို "အရှည်ဆုံး ချန်" စည်းမျဉ်းက
      //    [164] (၁၃၄ လုံး) ကို ဖျက်မိသည် ⇒ **အလိုအလျောက် စည်းမျဉ်း ဘယ်ဟာမှ မှန်မည် မဟုတ်**。
      //    🔴 ကတ်တွင် လူ တစ်ခုချင်း ရွေးရုံသာ ဖြစ်ရမည်。
      h+='<div class="foot">'
        +'<button class="sm" data-all="keep" data-g="'+gid+'">အားလုံး ချန်ထား</button></div></div>';
      out.push(h); SECS.push(gid);
      continue;
    }
    out.push(silUntil(s.start)); out.push(rowHtml(s,null)); i++;
  }
  out.push(silUntil(1e9));
  document.getElementById("list").innerHTML=out.join("")
    +'<div class="hint">— စာသား အဆုံး · ဝါကျ '+S.length+' ကြောင်း —<br>'
    +'<span style="font-size:11.5px;opacity:.8">နှိပ် = ဖျက်/ပြန်ထည့် · '
    +'⋯ = ဝါကျ အတွင်း ခွဲ · ⏸ အနားယူ ↩ ပြန်ချန် · ↑↓ ရွေး · X ဖျက် · '
    +'Space နားထောင် · '
    +'နှစ်ချက်နှိပ် = နားထောင် · ⌘Z ပြန်ပြင်</span></div>';
  document.getElementById("nsec").textContent=SECS.length;
  paint();
}

  var sp=e.target.closest("[data-splay]");
  if(sp){ e.stopPropagation();
    var k=sp.closest(".snd").getAttribute("data-sk").split(":");
    playRange(+k[0], +k[1], "🟢 အသံ "+Math.round((+k[1]-+k[0])*1000)+"ms"); return }
  var sd=e.target.closest("[data-sdel]");
  if(sd){ e.stopPropagation();
    var el=sd.closest(".snd"), kk=el.getAttribute("data-sk");
    if(SDEL[kk]){ delete SDEL[kk]; el.classList.remove("gone"); sd.textContent="✕ ဖျက်" }
    else { SDEL[kk]=1; el.classList.add("gone"); sd.textContent="↩ ပြန်ထည့်" }
    counts(); return }
  // ⚠️ ⏸ အနားယူချက် — နားထောင် / ချန်
  var pp=e.target.closest("[data-pplay]");
  if(pp){ e.stopPropagation();
    var pk=pp.closest(".pau").getAttribute("data-pk").split(":");
    playRange(+pk[0], +pk[1], "⏸ အနားယူ "+(+pk[1]-+pk[0]).toFixed(1)+"s"); return }
  var pkb=e.target.closest("[data-pkeep]");
  if(pkb){ e.stopPropagation();
    var pel=pkb.closest(".pau"), pkk=pel.getAttribute("data-pk");
    var sp2=pel.querySelector("span"), _d=(+pkk.split(":")[1]-+pkk.split(":")[0]);
    if(SKEEP[pkk]){ delete SKEEP[pkk]; pel.classList.remove("kept");
      pkb.textContent="↩ ပြန်ချန်"; if(sp2) sp2.textContent="⏸ "+_d.toFixed(1)+"s အနားယူ — ဖြတ်မည်" }
    else { SKEEP[pkk]=1; pel.classList.add("kept");
      pkb.textContent="✕ ဖြတ်"; if(sp2) sp2.textContent="⏸ "+_d.toFixed(1)+"s အနားယူ — ချန်မည်" }
    counts(); return }
  var sb=e.target.closest("[data-spl]");
  if(sb){ e.stopPropagation(); openParts(+sb.getAttribute("data-spl")); return }
  var pr=e.target.closest(".prow[data-pn]");
  if(pr){ var key=pr.getAttribute("data-pn");
    UNDO.push(Object.assign({},DEL));
    if(PDEL[key]) delete PDEL[key]; else PDEL[key]=1;
    paint(); return }
  var r=e.target.closest(".row[data-n]");
  if(r){ toggle(+r.getAttribute("data-n")); return }
});

/* ── ဝါကျ အတွင်း အပိုင်းများ ── */
function openParts(n){
  var row=document.querySelector('.row[data-n="'+n+'"]'); if(!row) return;
  if(row.nextElementSibling && row.nextElementSibling.classList.contains("prow")){
    var x=row.nextElementSibling;                       // ပိတ်
    while(x && x.classList.contains("prow")){ var y=x.nextElementSibling; x.remove(); x=y }
    return;
  }
  var s=D.sentences.find(function(z){return z.n===n}); if(!s||!s.parts) return;
  var html=s.parts.map(function(p,k){
    return '<div class="prow" data-pn="'+n+':'+k+'">'
      +'<div class="no">'+mm(p.start)+'</div>'
      +'<div class="tx">'+esc(p.text||("("+(p.end-p.start).toFixed(1)+"s — စာသား မရှိ · Space နဲ့ နားထောင်ပါ)"))+'</div></div>';
  }).join("");
  row.insertAdjacentHTML("afterend", html);
  paint();
}

/* ── ဆင့် ၄ — အတည်ပြု → ဖတ်ရန် → Edit → ဗီဒီယို ── */
var REV=false, BUSY=false;

  if(!JOB){tip("demo — job မရှိ၍ မထုတ်နိုင်ပါ");return}
  // ⚠️ `confirm()` **မသုံးရ** — တိတ်တဆိတ် false ပြန်လျှင် ခလုတ် နှိပ်လို့ မရဟု ဖြစ်သည်
  var self=this;

      "✂️ ထုတ်မယ်", fire);
  return;
  function fire(){

  // ⚠️ `review` = ASR ပြီးပြီ · ဗီဒီယို **မထုတ်ရသေး** ⇒ `approve` နဲ့ **ဒီ job ကိုပဲ**
  //    ဆက်သွားစေသည် ⇒ render **တစ်ခါပဲ**。 `done` ဆိုမှ `render` (job အသစ်)。
  // ⚠️ **နာမည် `REV` မသုံးရ** — အပေါ်က `var REV` (ဖတ်ရန် မြင်ကွင်း အခြေအနေ) ကို
  //    `var` hoisting နဲ့ **ဖုံးပစ်**သဖြင့် `if(!REV)` က အမြဲ မှန်ပြီး
  //    [✂️ Edit] နှိပ်တိုင်း ဖတ်ရန် မြင်ကွင်း ပြန်ဝင်နေကာ **ဘာမှ မဖြစ်**ခဲ့သည်
  //    (Zin ၂၀၂၆-၀၉-၁၉: 「ဒါ နှိပ်လို့ မရပါ」)。
  var isRev = (D.status === "review");
  var url  = isRev ? ("/api/jobs/"+JOB+"/approve") : ("/api/script/"+JOB+"/render");
  // ⚠️ ဝါကျ အတွင်း အပိုင်း ဖျက်ချက် — ဝါကျ တစ်ခုလုံး မဖျက်ထားမှသာ ပို့ရမည်
  var ds=[];
  // ⚠️ နားနဲ့ ရွေးထားသော အပိုင်း + ဖျက်ရန် မှတ်ထားသော အသံ ဖြစ်ရပ်
  Object.keys(TRIM).forEach(function(n){

/* ── ဖြတ်ပြီး — တိုးတက်မှု ပြ · ပြီးရင် preview ── */
var STG=["တင်နေသည်","စာသား","ဖြတ်နေသည်","စာတန်း","ဂရပ်ဖစ်","အသံ","ထုတ်နေသည်"];

           +'<a class="btn primary" style="text-decoration:none;margin:0" href="/#new">➕ နောက် ဗီဒီယို</a>'
           +'<a class="btn ghost" style="text-decoration:none" href="'+u+'">⬇ ဒေါင်းမယ်</a>'

       var pct=Math.max(3, Math.min(96, Math.round(sg/7*100)));
       var chips=STG.map(function(nm,k){
         var cls = (k+1<sg) ? "ok" : (k+1===sg ? "now" : "");
         return '<s class="'+cls+'">'+(k+1<sg?"✓ ":"")+esc(nm)+'</s>';
       }).join("");
       el.innerHTML='<span class="pct">'+pct+'%</span>'
         +'<b>ဖြတ်နေပါပြီ…</b> '+esc(STG[sg-1]||"")+' · '+Math.round((Date.now()-t0)/1000)+'s'
         +'<div class="pbar"><i style="width:'+pct+'%"></i></div>'
         +'<div style="font-size:12.5px;color:var(--mute)">အဆင့် '+sg+'/7 — ပြီးရင် ဒီမှာပဲ ပြပါမယ်</div>'
         +'<div class="pstg">'+chips+'</div>';
       setTimeout(tick, 4000);
     }).catch(function(){ setTimeout(tick, 6000) });
  }
  tick();
}



/* ── အသံလှိုင်း (waveform) ─────────────────────────────────
   ⚠️ Zin ၂၀၂၆-၀၉-၁၉: 「အသံ နားထောင်ပြီး **ဘယ်ဟာ ဖျက်နေလဲ မမြင်ရတာ**
      ပြသနာ ဖြစ်နေတယ်」 ⇒ ဘား ဗလာ မဟုတ်ဘဲ **တကယ့် အသံပုံ** ဆွဲပြသည်。
      ချောင်းဆိုးသံက ချွန်ထွက်နေသော အစွန်း အဖြစ် **မျက်စိနဲ့ မြင်ရ**မည်。
   ⚠️ အသံဖိုင် တစ်ခါပဲ ဆွဲပြီး **peak array** အဖြစ် ချုံ့သိမ်းသည် —
      AudioBuffer အပြည့် ချန်ထားလျှင် ၆ မိနစ်အတွက် ~၆၃ MB ဖြစ်မည်。 */
var WAVE={peaks:null, hz:200, dur:0, state:"—"};
function waveLoad(){
  if(WAVE.state!=="—" || !AUDIO) return Promise.resolve();
  WAVE.state="loading";
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){ WAVE.state="fail"; return Promise.resolve() }
  return fetch(AUDIO).then(function(r){return r.arrayBuffer()})
    .then(function(b){ return new AC().decodeAudioData(b) })
    .then(function(buf){
      var ch=buf.getChannelData(0), sr=buf.sampleRate;
      var n=Math.ceil(buf.duration*WAVE.hz), step=Math.floor(ch.length/n)||1;
      var pk=new Float32Array(n);
      for(var i=0;i<n;i++){
        var a=i*step, b2=Math.min(ch.length,a+step), m=0;
        for(var j=a;j<b2;j++){ var v=ch[j]<0?-ch[j]:ch[j]; if(v>m) m=v }
        pk[i]=m;
      }
      WAVE.peaks=pk; WAVE.dur=buf.duration; WAVE.state="ok";
      document.querySelectorAll("canvas[data-w]").forEach(function(c){ waveDraw(c) });
    })
    .catch(function(e){ WAVE.state="fail"; });
}
function waveDraw(c){
  var t0=+c.getAttribute("data-w0"), t1=+c.getAttribute("data-w1");
  var W=c.width=c.clientWidth*2, H=c.height=c.clientHeight*2;
  var g=c.getContext("2d"); g.clearRect(0,0,W,H);
  if(WAVE.state!=="ok"){
    g.fillStyle="#E7E5E4"; g.fillRect(0,H/2-1,W,2); return;
  }
  var a=Math.floor(t0*WAVE.hz), b=Math.ceil(t1*WAVE.hz), n=Math.max(1,b-a);
  // ⚠️ အမြင့်ဆုံးနဲ့ ချိန်ညှိ — တိုးမထားလျှင် စကားသံ ပြားနေပြီး ဘာမှ မမြင်ရ
  var mx=0.02;
  for(var i=a;i<b;i++){ var v=WAVE.peaks[i]||0; if(v>mx) mx=v }
  // ⚠️ ဖြစ်ရပ် တည်နေရာကို **အရောင်နဲ့ ပြရမည်** — ဘေးက အခြေအနေထဲမှာ
  //    ဘယ်ဟာလဲ မသိလျှင် ပြတာ အလကား ဖြစ်သည် (Zin ၂၀၂၆-၀၉-၁၉)。
  var ha=c.getAttribute("data-ha"), hb=c.getAttribute("data-hb");
  if(ha!=null&&hb!=null){
    var hx=(+ha-t0)/(t1-t0)*W, hw=Math.max(3,(+hb-+ha)/(t1-t0)*W);
    g.fillStyle="#DCFCE7"; g.fillRect(hx,0,hw,H);
    g.strokeStyle="#16A34A"; g.lineWidth=2;
    g.beginPath(); g.moveTo(hx,0); g.lineTo(hx,H);
    g.moveTo(hx+hw,0); g.lineTo(hx+hw,H); g.stroke();
  }
  g.fillStyle="#A8A29E";
  for(var x=0;x<W;x++){
    var _k2=a+Math.floor(x/W*n);
    if(ha!=null){ var _t=t0+(x/W)*(t1-t0);
      g.fillStyle=(_t>=+ha&&_t<=+hb)?"#15803D":"#A8A29E"; }
    var k=a+Math.floor(x/W*n), v=(WAVE.peaks[k]||0)/mx;
    var h=Math.max(2, v*(H-8));
    g.fillRect(x, (H-h)/2, 1, h);
  }
}
/* ── ဝါကျ အတွင်း — နားနဲ့ ရွေးဖျက်ခြင်း ───────────────────────
   ⚠️ စကားလုံး အချိန်မှတ် (ASR words) ကို **မသုံးပါ** — ဖြတ်ဖို့ ကြမ်းလွန်းသည်
      ဟု ၂၀၂၆-၀၉-၁၈ မှာ တိုင်းပြီးသား。 ⇒ သုံးစွဲသူ **နားထောင်ပြီး ကိုယ်တိုင်
      ရွေး**သည် · worker က `CUT.guard` နဲ့ တိတ်ဆိတ်မှုဆီ snap လုပ်ပေးသည်。 */
function trimOpen(n){
  var row=document.querySelector('.row[data-n="'+n+'"]'); if(!row) return;
  var old=document.querySelector('.trim[data-tn="'+n+'"]');
  if(old){ old.remove(); return; }
  var s=D.sentences.find(function(x){return x.n===n}); if(!s) return;
  var A=s.start, B=s.end, W=B-A;
  var box=document.createElement("div");
  box.className="trim"; box.setAttribute("data-tn",n);
  box.innerHTML='<div class="tbar"><canvas data-w data-w0="'+A+'" data-w1="'+B+'"></canvas>'
    +'<i></i><s></s></div>'

    +'<button data-b disabled>▶ ရွေးထားတာ</button>'
    +'<button class="go" data-c disabled>✂ ဤအပိုင်း ဖျက်</button>'
    +'<button data-d>↩ အားလုံး ပြန်ထည့်</button>'
    +'<em></em></div>';
  row.parentNode.insertBefore(box, row.nextSibling);
  var bar=box.querySelector(".tbar"), sel=bar.querySelector("i"), pin=bar.querySelector("s");
  var x0=null, x1=null;
  function px(ev){

    return Math.max(0, Math.min(1, ((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width));
  }
  function draw(){

    [].slice.call(bar.querySelectorAll("u")).forEach(function(u){u.remove()});
    var tot=0;
    (TRIM[n]||[]).forEach(function(d){
      var u=document.createElement("u");
      u.style.left=((d[0]-A)/W*100)+"%"; u.style.width=((d[1]-d[0])/W*100)+"%";
      u.title=(d[1]-d[0]).toFixed(2)+"s — နှိပ်၍ ပြန်ထည့်";
      u.onclick=function(ev){ ev.stopPropagation();

        if(!TRIM[n].length) delete TRIM[n];
        draw(); counts(); paintTrim(n); };
      bar.appendChild(u); tot+=d[1]-d[0];
    });
    if(x0!=null&&x1!=null){ var a=Math.min(x0,x1), b=Math.max(x0,x1);
      sel.style.display="block"; sel.style.left=(a*100)+"%"; sel.style.width=((b-a)*100)+"%"; }
    else sel.style.display="none";
    box.querySelector("[data-b]").disabled = (x0==null);
    box.querySelector("[data-c]").disabled = (x0==null || Math.abs(x1-x0)*W < 0.05);
    box.querySelector("em").textContent =
      "ဝါကျ "+W.toFixed(1)+"s" + (tot? "  ·  ဖျက်ပြီး "+tot.toFixed(2)+"s" : "");
  }
  bar.addEventListener("mousedown",function(ev){ x0=px(ev); x1=x0; draw();
    function mv(e2){ x1=px(e2); draw(); }
    function up(){ document.removeEventListener("mousemove",mv);
      document.removeEventListener("mouseup",up); }
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  });
  box.querySelector("[data-a]").onclick=function(){ playRange(A,B,"["+n+"] ဝါကျ အားလုံး") };
  box.querySelector("[data-b]").onclick=function(){
    var a=A+Math.min(x0,x1)*W, b=A+Math.max(x0,x1)*W;
    playRange(a,b,"ရွေးထားတာ "+(b-a).toFixed(2)+"s"); };
  box.querySelector("[data-c]").onclick=function(){
    var a=A+Math.min(x0,x1)*W, b=A+Math.max(x0,x1)*W;
    (TRIM[n]=TRIM[n]||[]).push([+a.toFixed(2), +b.toFixed(2)]);
    TRIM[n].sort(function(p,q){return p[0]-q[0]});
    x0=x1=null; draw(); counts(); paintTrim(n);
    tip("ဖျက်မည့် အပိုင်း ထည့်ပြီး — "+(b-a).toFixed(2)+"s"); };

  // ⚠️ ဖမ်းမိထားသော **စကား မဟုတ်သော အသံ**ကို ဤဝါကျထဲမှာ ကြိုပြပေးသည် —
  //    user က ရှာစရာ မလိုဘဲ ချောင်းဆိုးသံကို တန်း မြင်ရ (Zin ၂၀၂၆-၀၉-၁၉)
  (D.events||[]).forEach(function(e){

  playRange(A,B,"["+n+"] ဝါကျ အားလုံး");
}
function paintTrim(n){
  var b=document.querySelector('.row[data-n="'+n+'"] [data-trim]');
  if(b) b.classList.toggle("cut", !!(TRIM[n]||[]).length);
}
/* ── keyboard ── */
document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="z"){e.preventDefault();undo();return}
  var rows=[].slice.call(document.querySelectorAll(".row[data-n]"));
  if(e.key==="ArrowDown"){e.preventDefault();select(SEL+1)}
  else if(e.key==="ArrowUp"){e.preventDefault();select(SEL-1)}
  else if(e.key.toLowerCase()==="x"&&SEL>=0){e.preventDefault();
    toggle(+rows[SEL].getAttribute("data-n"))}
  else if(e.key===" "&&SEL>=0){e.preventDefault();play(+rows[SEL].getAttribute("data-n"))}
});

/* ── ရေးထားသော script ── */
function sinfo(t){ document.getElementById("sinfo").textContent=t||"" }
function sload(){
  if(!JOB) return;
  document.getElementById("sbox").hidden=false;
  if(D&&D.script) sinfo("script "+D.script.chars+" လုံး · အနီ "
    +((D.script.missing||0)+(D.script.dup||0))+" ကြောင်း");
}
function ssend(t){
  if(!JOB){tip("demo — job မရှိ");return}
  fetch("/api/script/"+JOB+"/source",{method:"POST",
    headers:{"Content-Type":"application/json",
             Authorization:"Bearer "+(localStorage.getItem("ikki_token")||"")},
    body:JSON.stringify({text:t})})
   .then(function(r){return r.json()})
   .then(function(){ tip("သိမ်းပြီး — ပြန်ဖတ်နေသည်…"); location.reload() })
   .catch(function(e){ tip("မသိမ်းနိုင်ပါ — "+(e.message||e)) });
}
document.addEventListener("DOMContentLoaded",function(){
  var f=document.getElementById("sfile");
  if(f) f.onchange=function(){
    var file=this.files[0]; if(!file) return;
    // ⚠️ `.docx` က zip ⇒ browser မှာ ဖွင့်လို့ မရ ⇒ server ကို **binary** ပို့ရမည်。
    //    ယခု အဆင့်မှာ `.txt` ကိုသာ browser က ဖတ်သည် · `.docx` ကို server က ဖတ်။
    if(/\.docx$/i.test(file.name)){
      var fd=new FileReader();
      fd.onload=function(){ ssend("__DOCX__"+btoa(String.fromCharCode.apply(null,
        new Uint8Array(fd.result)))) };
      fd.readAsArrayBuffer(file); return;
    }
    var fr=new FileReader();
    fr.onload=function(){ document.getElementById("stxt").value=fr.result; ssend(fr.result) };
    fr.readAsText(file,"utf-8");
  };
  var sv=document.getElementById("ssave");
  if(sv) sv.onclick=function(){ ssend(document.getElementById("stxt").value||"") };
  var cl=document.getElementById("sclr");
  if(cl) cl.onclick=function(){ document.getElementById("stxt").value=""; ssend("") };
});

var q=new URLSearchParams(location.search);
var demo=q.get("demo"), job=q.get("job");
JOB = demo ? null : (job||null);          // demo မှာ render မလုပ်ရ
// ⚠️ job ရှိလျှင် **အသံ proxy** ကို အလိုအလျောက် သုံးသည် (နားထောင်ပြီးမှ ဖြတ်နိုင်ရန်)。
//    `<audio>` က Authorization header မပို့နိုင်၍ token ကို `?t=` နဲ့ ပေးရသည်。
AUDIO = q.get("audio") || (JOB ? ("/api/jobs/"+JOB+"/audio?t="
        +encodeURIComponent(localStorage.getItem("ikki_token")||"")) : null);
if(AUDIO) document.getElementById("au").src=AUDIO;
var url = demo ? demo : ("/api/script/"+(job||""));
var opt = demo ? {} : {headers:{Authorization:"Bearer "+(localStorage.getItem("ikki_token")||"")}};
// ⚠️ ဖြတ်နေဆဲမှာ စာမျက်နှာ ပိတ်/refresh လုပ်လျှင် တိုးတက်မှု ပျောက်သွားသည် ⇒
//    ပြန်ဖွင့်တိုင်း job အခြေအနေ စစ်ပြီး **အလိုအလျောက် ပြန်ပြ**သည် (Zin ၂၀၂၆-၀၉-၁၉:
//    「ဗီဒီယို ထုတ်မယ် လုပ်လိုက်ရင် ဘယ်မှာ မြင်နေရမှာလဲ」)。
if(JOB) fetch("/api/jobs/"+JOB,
    {headers:{Authorization:"Bearer "+(localStorage.getItem("ikki_token")||"")}})
  .then(function(r){return r.json()}).then(function(j){
    if(["queued","running","cutting"].indexOf(j.status)<0) return;
    var el=document.getElementById("dn")||document.createElement("div");
    el.id="dn"; el.className="done"; document.querySelector(".wrap").prepend(el);
    document.body.classList.add("rv");
    document.getElementById("bok").textContent="ထုတ်နေသည်…";
    watchJob(JOB, el);
  }).catch(function(){});
fetch(url,opt).then(function(r){return r.json()}).then(function(d){render(d); sload(); waveLoad();})
  .catch(function(e){document.getElementById("list").innerHTML=
    '<div class="hint">ဖတ်လို့ မရပါ — '+esc(e.message||e)+'</div>'});
</script>
